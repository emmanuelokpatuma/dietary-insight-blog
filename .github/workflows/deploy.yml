name: Build and deploy blog
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"   # daily rebuild, picks up posts dated today
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown pyyaml jinja2 pillow
      - run: python build.py
      - name: Publish built site to the deploy branch (Hostinger pulls this)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./public
          force_orphan: false
      - name: Notify Bing and other search engines (IndexNow)
        run: sleep 90 && python indexnow.py
        continue-on-error: true
